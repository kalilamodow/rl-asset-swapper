[package]
name = "upk-swapper"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = "0.36.0"
egui-async = "0.6.0"
futures = "0.3.34"
reqwest = "0.13.5"
rfd = "0.17.2"
rlbuddy-upk-swapper = { git = "https://github.com/kalilamodow/rlbuddy.git" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures = { version = "0.3.34", default-features = false, features = ["executor"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.50"
web-sys = "0.3.70"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 2
